# Ambientes del paquete modelo_inmuebles (ejecutar desde paquete-modelo/):
#   tox run -e train          entrena los dos modelos con config.yml (necesita ../data/, ver config.yml)
#   tox run -e test_package   entrena y luego corre las pruebas del paquete
#   tox run -e test           solo las pruebas, con los modelos ya guardados en el paquete (lo usa GitHub Actions)
[tox]
min_version = 4
envlist = test_package
skipsdist = True

[testenv]
install_command = pip install {opts} {packages}
setenv =
    PYTHONPATH = .
    PYTHONHASHSEED = 0
passenv =
    MLFLOW_TRACKING_URI

[testenv:train]
deps = -rrequirements/train_requirements.txt
commands = python modelo_inmuebles/train_pipeline.py {posargs}

[testenv:test_package]
deps =
    -rrequirements/test_requirements.txt
    -rrequirements/train_requirements.txt
commands =
    python modelo_inmuebles/train_pipeline.py {posargs}
    pytest -vv tests/

[testenv:test]
deps = -rrequirements/test_requirements.txt
commands = pytest -vv tests/
